name: Deploy OctoCAT to Azure

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-${{ github.ref }}
  cancel-in-progress: false

env:
  AZURE_ENVIRONMENT_NAME: dev

jobs:
  validate:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API dependencies
        run: |
          python -m venv src/api-py/.venv
          src/api-py/.venv/bin/python -m pip install --disable-pip-version-check -r src/api-py/requirements.txt

      - name: Test and validate Python API
        run: make -C src test-py build-py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: src/frontend

      - name: Lint and build frontend
        run: |
          npm run lint
          npm run build
        working-directory: src/frontend

      - name: Build API image
        run: docker build --platform linux/amd64 -f src/api-py/Dockerfile -t octocat-api:${{ github.sha }} .

      - name: Build frontend image
        run: docker build --platform linux/amd64 -t octocat-frontend:${{ github.sha }} src/frontend

      - name: Install Bicep
        run: az bicep install

      - name: Validate Bicep templates
        run: |
          az bicep build --file infra/registry.bicep --stdout > /dev/null
          az bicep build --file infra/main.bicep --stdout > /dev/null

  deploy:
    name: Provision and deploy
    needs: validate
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: azure-dev
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_NAME_PREFIX: ${{ vars.AZURE_NAME_PREFIX }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Install Bicep
        run: az bicep install

      - name: Create resource group
        run: |
          : "${AZURE_RESOURCE_GROUP:?Set the AZURE_RESOURCE_GROUP environment variable}"
          : "${AZURE_LOCATION:?Set the AZURE_LOCATION environment variable}"
          : "${AZURE_NAME_PREFIX:?Set a globally unique AZURE_NAME_PREFIX environment variable}"
          if [[ ! "$AZURE_NAME_PREFIX" =~ ^[a-z0-9]{2,12}$ ]]; then
            echo "AZURE_NAME_PREFIX must be 2-12 lowercase letters or digits" >&2
            exit 1
          fi
          if [[ "$(az group exists --name "$AZURE_RESOURCE_GROUP")" != "true" ]]; then
            az group create \
              --name "$AZURE_RESOURCE_GROUP" \
              --location "$AZURE_LOCATION" \
              --output none
          fi

      - name: Provision container registry
        id: registry
        run: |
          REGISTRY_DEPLOYMENT="registry-${GITHUB_RUN_ID}"
          az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$REGISTRY_DEPLOYMENT" \
            --template-file infra/registry.bicep \
            --parameters \
              location="$AZURE_LOCATION" \
              namePrefix="$AZURE_NAME_PREFIX" \
              environmentName="$AZURE_ENVIRONMENT_NAME" \
            --output none

          ACR_NAME="$(az deployment group show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$REGISTRY_DEPLOYMENT" \
            --query properties.outputs.registryName.value \
            --output tsv)"
          LOGIN_SERVER="$(az deployment group show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$REGISTRY_DEPLOYMENT" \
            --query properties.outputs.loginServer.value \
            --output tsv)"
          echo "ACR_NAME=$ACR_NAME" >> "$GITHUB_ENV"
          echo "LOGIN_SERVER=$LOGIN_SERVER" >> "$GITHUB_ENV"

      - name: Authenticate to ACR
        run: az acr login --name "$ACR_NAME" --output none

      - name: Build and push API image
        run: |
          IMAGE="$LOGIN_SERVER/api:$IMAGE_TAG"
          docker build --platform linux/amd64 -f src/api-py/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Build and push frontend image
        run: |
          IMAGE="$LOGIN_SERVER/frontend:$IMAGE_TAG"
          docker build --platform linux/amd64 -t "$IMAGE" src/frontend
          docker push "$IMAGE"

      - name: Preview infrastructure changes
        run: |
          DEPLOYMENT_NAME="octocat-${AZURE_ENVIRONMENT_NAME}-${GITHUB_RUN_ID}"
          echo "DEPLOYMENT_NAME=$DEPLOYMENT_NAME" >> "$GITHUB_ENV"
          az deployment group what-if \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$DEPLOYMENT_NAME" \
            --template-file infra/main.bicep \
            --parameters @infra/main.parameters.json \
              location="$AZURE_LOCATION" \
              namePrefix="$AZURE_NAME_PREFIX" \
              environmentName="$AZURE_ENVIRONMENT_NAME" \
              apiImage="$LOGIN_SERVER/api:$IMAGE_TAG" \
              frontendImage="$LOGIN_SERVER/frontend:$IMAGE_TAG"

      - name: Deploy infrastructure and application
        run: |
          az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$DEPLOYMENT_NAME" \
            --template-file infra/main.bicep \
            --parameters @infra/main.parameters.json \
              location="$AZURE_LOCATION" \
              namePrefix="$AZURE_NAME_PREFIX" \
              environmentName="$AZURE_ENVIRONMENT_NAME" \
              apiImage="$LOGIN_SERVER/api:$IMAGE_TAG" \
              frontendImage="$LOGIN_SERVER/frontend:$IMAGE_TAG" \
            --output none

      - name: Smoke-test deployed endpoints
        run: |
          FRONTEND_URL="$(az deployment group show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$DEPLOYMENT_NAME" \
            --query properties.outputs.frontendUrl.value \
            --output tsv)"
          API_URL="$(az deployment group show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$DEPLOYMENT_NAME" \
            --query properties.outputs.apiUrl.value \
            --output tsv)"

          curl --fail --silent --show-error --retry-all-errors --retry 30 \
            --retry-delay 5 --max-time 15 "$FRONTEND_URL/" --output /dev/null
          curl --fail --silent --show-error --retry-all-errors --retry 30 \
            --retry-delay 5 --max-time 15 "$API_URL/" --output /dev/null
          curl --fail --silent --show-error --retry-all-errors --retry 30 \
            --retry-delay 5 --max-time 15 "$API_URL/api/products" |
            python -c "import json, sys; products = json.load(sys.stdin); assert products, 'API returned no seeded products'"

          curl --fail --silent --show-error \
            --dump-header "$RUNNER_TEMP/api-headers.txt" \
            --output /dev/null \
            --header "Origin: $FRONTEND_URL" \
            "$API_URL/api/products"
          grep --fixed-strings --ignore-case \
            "access-control-allow-origin: $FRONTEND_URL" \
            "$RUNNER_TEMP/api-headers.txt"

          echo "::notice title=Azure deployment::$FRONTEND_URL"
